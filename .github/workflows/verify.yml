name: 厳密解法（HiGHS）との照合

# 画面の計算（回数の割り振り・必要な肉・毎日の時間）を、厳密解法と比べる。時間がかかるので、手動で走らせる
# （GitHub の Actions タブ →「厳密解法（HiGHS）との照合」→ Run workflow）。
on:
  workflow_dispatch:

jobs:
  highs:
    name: HiGHS との照合
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - name: 依存を入れる
        run: |
          npm ci
          pip install -r verification/requirements.txt
          npx playwright install --with-deps chromium
      - name: 照合を走らせる
        run: npm run verify
      - name: 取り出した問題を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-instances
          path: verification/out/
          if-no-files-found: ignore
